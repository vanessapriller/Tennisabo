<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tennisabo TC Kamper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chalk:#F5F7F1;
    --paper:#FFFFFF;
    --ink:#1E2A22;
    --ink-soft:#5B6B60;
    --line:#DCE0D6;
    --ball:#C7D934;
    --ball-ink:#38430E;
    --clay:#A8562E;
    --clay-soft:#F1DFD3;
    --court:#2F6F5E;
    --court-deep:#1F4A3D;
    --p-aufreiter:#2F6FA8;
    --p-priller:#C4432B;
    --p-grandl:#7A4E9E;
    --p-praska:#C99A2E;
    --p-schimek:#1E7A6E;
    --shadow: 0 10px 28px rgba(30,42,34,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--chalk);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  #courtBg{
    position:fixed; inset:-60px;
    pointer-events:none;
    filter:blur(26px) saturate(1.15);
    transform:scale(1.1);
    z-index:-2;
  }
  #courtBg svg{width:100%; height:100%; display:block;}
  #courtBgOverlay{
    position:fixed; inset:0;
    pointer-events:none;
    background:rgba(245,247,241,0.8);
    z-index:-1;
  }
  .display{font-family:'Barlow Condensed','Inter',sans-serif;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:rgba(245,247,241,0.92);
    backdrop-filter:blur(6px);
    padding:16px 18px 12px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
  }
  header.top .emblem{width:30px;height:30px;flex-shrink:0;}
  header.top .titles{flex:1; min-width:0;}
  header.top h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:24px;
    margin:0;
    letter-spacing:0.2px;
    line-height:1.1;
  }
  header.top p{
    margin:1px 0 0;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .refresh-btn{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:20px;
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
    cursor:pointer;
    flex-shrink:0;
  }
  .refresh-btn svg{width:16px;height:16px;}
  .refresh-btn.spin svg{animation:spin 0.7s linear;}
  @keyframes spin{to{transform:rotate(360deg);}}

  main{max-width:520px; margin:0 auto; padding:0 16px;}

  /* ---- hero: match ticket ---- */
  .hero{
    margin-top:18px;
    border-radius:20px;
    box-shadow:var(--shadow);
    overflow:visible;
    animation:heroIn .5s ease both;
  }
  @keyframes heroIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .hero-top{
    color:var(--chalk);
    border-radius:20px 20px 0 0;
    padding:20px 20px 24px;
    position:relative;
    overflow:hidden;
    background:var(--court-deep);
  }
  .hero-photo{
    position:absolute; inset:-24px;
    background-image:url("data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgNDAwIDYwMCIgcHJlc2VydmVBc3BlY3RSYXRpbz0ieE1pZFlNaWQgc2xpY2UiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CiAgPGRlZnM+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9InNreUdyYWQiIHgxPSIwIiB5MT0iMCIgeDI9IjAiIHkyPSIxIj4KICAgICAgPHN0b3Agb2Zmc2V0PSIwJSIgc3RvcC1jb2xvcj0iIzE0MUYyNiIvPgogICAgICA8c3RvcCBvZmZzZXQ9IjQ1JSIgc3RvcC1jb2xvcj0iIzFCM0EzMiIvPgogICAgICA8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiMyRjZGNUUiLz4KICAgIDwvbGluZWFyR3JhZGllbnQ+CiAgICA8cmFkaWFsR3JhZGllbnQgaWQ9Imdsb3ciIGN4PSI1MCUiIGN5PSI1MCUiIHI9IjUwJSI+CiAgICAgIDxzdG9wIG9mZnNldD0iMCUiIHN0b3AtY29sb3I9IiNGRkY2RDgiIHN0b3Atb3BhY2l0eT0iMC45Ii8+CiAgICAgIDxzdG9wIG9mZnNldD0iMTAwJSIgc3RvcC1jb2xvcj0iI0ZGRjZEOCIgc3RvcC1vcGFjaXR5PSIwIi8+CiAgICA8L3JhZGlhbEdyYWRpZW50PgogIDwvZGVmcz4KICA8cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjYwMCIgZmlsbD0idXJsKCNza3lHcmFkKSIvPgogIDxjaXJjbGUgY3g9IjU1IiBjeT0iODUiIHI9IjEzMCIgZmlsbD0idXJsKCNnbG93KSIvPgogIDxjaXJjbGUgY3g9IjM1MCIgY3k9IjU1IiByPSIxNTAiIGZpbGw9InVybCgjZ2xvdykiLz4KICA8cGF0aCBkPSJNMCwxNTAgUTIwMCwxMDggNDAwLDE1MCBMNDAwLDE4MiBRMjAwLDE0NiAwLDE4MiBaIiBmaWxsPSIjMEUxQTE3IiBvcGFjaXR5PSIwLjU1Ii8+CiAgPHBvbHlnb24gcG9pbnRzPSI3MCw2MDAgMzMwLDYwMCAyNjAsMzAwIDE0MCwzMDAiIGZpbGw9IiMzQjgwNjgiIG9wYWNpdHk9IjAuOSIvPgogIDxwb2x5Z29uIHBvaW50cz0iNzAsNjAwIDMzMCw2MDAgMjYwLDMwMCAxNDAsMzAwIiBmaWxsPSJub25lIiBzdHJva2U9IiNFQUYyRTkiIHN0cm9rZS13aWR0aD0iMyIgb3BhY2l0eT0iMC41Ii8+CiAgPGxpbmUgeDE9IjIwMCIgeTE9IjYwMCIgeDI9IjIwMCIgeTI9IjMwMCIgc3Ryb2tlPSIjRUFGMkU5IiBzdHJva2Utd2lkdGg9IjIiIG9wYWNpdHk9IjAuNCIvPgogIDxsaW5lIHgxPSIxMTAiIHkxPSI0MzAiIHgyPSIyOTAiIHkyPSI0MzAiIHN0cm9rZT0iI0VBRjJFOSIgc3Ryb2tlLXdpZHRoPSIyIiBvcGFjaXR5PSIwLjQiLz4KICA8bGluZSB4MT0iMTIwIiB5MT0iMzAwIiB4Mj0iMjgwIiB5Mj0iMzAwIiBzdHJva2U9IiNGNUY3RjEiIHN0cm9rZS13aWR0aD0iNCIgb3BhY2l0eT0iMC41NSIvPgo8L3N2Zz4=");
    background-size:cover;
    background-position:50% 22%;
    filter:blur(9px) saturate(1.3) brightness(1.05);
    transform:scale(1.15);
  }
  .hero-tint{
    position:absolute; inset:0;
    background:linear-gradient(155deg, rgba(47,111,94,0.80) 0%, rgba(19,43,36,0.88) 100%);
  }
  .hero-content{position:relative; z-index:1;}
  .hero-top .label{font-size:13px; color:rgba(245,247,241,0.75); margin:0 0 6px;}
  .hero-top .date-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .hero-top .date-main{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:29px;
    line-height:1.05;
  }
  .countdown{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:14px;
    background:var(--ball);
    color:var(--ball-ink);
    padding:5px 13px;
    border-radius:14px;
    white-space:nowrap;
  }
  .hero-top .meta{font-size:13px; color:rgba(245,247,241,0.8); margin-top:5px;}
  .holiday-tag{
    display:inline-block; margin-top:9px;
    font-size:12.5px; color:var(--clay);
    background:var(--clay-soft);
    padding:4px 10px; border-radius:10px;
  }
  .holiday-tag.on-dark{
    color:var(--chalk); background:rgba(245,247,241,0.18);
  }
  .perforation{
    position:relative;
    height:2px;
    background-image:repeating-linear-gradient(to right, rgba(30,42,34,0.28) 0 8px, transparent 8px 16px);
    margin:0 18px;
  }
  .perforation::before,.perforation::after{
    content:""; position:absolute; top:-11px; width:22px; height:22px;
    border-radius:50%; background:var(--chalk);
  }
  .perforation::before{left:-29px;}
  .perforation::after{right:-29px;}
  .hero-bottom{
    background:var(--paper);
    border-radius:0 0 20px 20px;
    padding:20px;
  }
  .players-grid{
    display:grid; grid-template-columns:1fr 1fr;
    gap:9px;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--chalk);
    border-radius:12px;
    padding:8px 12px 8px 8px;
    font-size:14.5px;
    font-weight:600;
    text-align:left;
    cursor:pointer;
    display:flex; align-items:center; gap:9px;
    min-height:46px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  .chip:active{transform:scale(0.98);}
  .avatar{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-size:12px; font-weight:700; flex-shrink:0;
    font-family:'Inter',sans-serif;
  }
  .chip.guest{
    border-style:dashed;
    border-color:var(--clay);
    background:#fff;
    color:var(--clay);
  }
  .chip.guest .avatar{
    background:transparent; border:1.5px dashed var(--clay); color:var(--clay);
  }
  .hint{font-size:12.5px; color:var(--ink-soft); margin:14px 2px 0;}
  .hero-empty{margin:0; font-size:15px;}

  .segmented{
    display:flex; margin:22px 0 4px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:4px;
  }
  .segmented button{
    flex:1; border:none; background:transparent;
    padding:9px 0; font-size:13.5px; font-weight:600;
    color:var(--ink-soft); border-radius:10px; cursor:pointer;
    font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .segmented button svg{width:15px;height:15px;}
  .segmented button.active{
    background:var(--ink); color:var(--chalk);
  }

  .month-group{margin-top:24px;}
  .month-title{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:18px;
    color:var(--court);
    margin:0 0 4px 2px;
  }
  .net-divider{
    height:5px; margin:0 0 14px 2px;
    border-top:2px solid var(--line);
    background-image:repeating-linear-gradient(to right, var(--line) 0 2px, transparent 2px 9px);
    background-position:top left; background-repeat:repeat-x; background-size:9px 5px;
  }
  .timeline{position:relative; padding-left:16px;}
  .timeline::before{
    content:""; position:absolute; left:4px; top:4px; bottom:4px;
    width:1.5px; background:var(--line);
  }
  .row{
    position:relative;
    margin-bottom:10px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .row::before{
    content:""; position:absolute; left:-16px; top:19px;
    width:7px; height:7px; border-radius:50%;
    background:var(--court);
    box-shadow:0 0 0 3px var(--chalk);
  }
  .row.past{opacity:0.5;}
  .row.past::before{background:var(--ink-soft);}
  .row .row-date-wrap{display:flex; align-items:center; width:100%; justify-content:space-between; margin-bottom:9px;}
  .row .row-date{
    font-size:13.5px; font-weight:700; color:var(--ink);
    display:flex; align-items:center; gap:8px;
  }
  .row .row-date .wk{color:var(--ink-soft); font-weight:500;}
  .date-edit-input{
    border:none; background:transparent; font:inherit; font-weight:700;
    color:var(--ink); padding:0; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .row-players{display:flex; flex-wrap:wrap; gap:6px;}
  .row-players .chip{
    padding:5px 10px 5px 5px; font-size:13px; min-height:0;
  }
  .row-players .avatar{width:20px;height:20px; font-size:10px;}

  .stats-table{margin-top:16px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--paper);}
  .stats-row{
    display:flex; align-items:center; gap:11px;
    padding:13px 14px; border-bottom:1px solid var(--line);
  }
  .stats-row:last-child{border-bottom:none;}
  .stats-row .avatar{width:28px;height:28px;font-size:12px;}
  .stats-name{width:78px; font-weight:600; font-size:14px; flex-shrink:0;}
  .stats-bar-wrap{flex:1; background:var(--chalk); border-radius:6px; height:8px; overflow:hidden;}
  .stats-bar{height:100%; border-radius:6px;}
  .stats-num{width:104px; text-align:right; font-size:12.5px; color:var(--ink-soft); flex-shrink:0;}
  .stats-note{font-size:12.5px; color:var(--ink-soft); margin:12px 4px 0; line-height:1.55;}

  /* ---- Colarum-Konto ---- */
  .colarum-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px;}
  .colarum-meta{font-size:11.5px; color:var(--ink-soft);}
  .colarum-add{
    width:36px; height:36px; border-radius:50%; border:none; flex-shrink:0;
    background:var(--ball); color:var(--ball-ink);
    font-size:22px; font-weight:700; line-height:1; cursor:pointer;
    font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .colarum-add:active{transform:scale(0.92);}
  .colarum-sub{
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:16px;
    color:var(--ink); margin:20px 0 8px 2px;
  }
  .colarum-log{
    display:flex; align-items:center; gap:10px; padding:9px 12px;
    background:var(--paper); border:1px solid var(--line); border-radius:12px; margin-bottom:6px;
  }
  .colarum-log .avatar{width:22px; height:22px; font-size:10px;}
  .colarum-log .log-text{flex:1; min-width:0; font-size:13px;}
  .log-paid{
    border:1px solid var(--clay); color:var(--clay); background:var(--clay-soft);
    border-radius:10px; padding:4px 10px; font-size:12px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .log-paid.is-paid{border-color:var(--court); color:var(--chalk); background:var(--court);}
  .log-del{
    border:none; background:none; color:var(--ink-soft); font-size:20px; line-height:1;
    cursor:pointer; padding:0 4px; font-family:'Inter',sans-serif;
  }

  /* ---- Einspringer und Terminänderungen ---- */
  .chip-text{display:flex; flex-direction:column; line-height:1.2; min-width:0;}
  .chip-sub{font-size:11px; font-weight:500; color:var(--ink-soft);}
  .chip.guest .chip-sub{color:var(--clay); opacity:0.85;}
  .row-players .chip-sub{font-size:10.5px;}
  .tag-group{display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
  .tag-group .holiday-tag{margin-top:0;}
  .moved-tag{
    display:inline-block; font-size:12px; color:var(--court);
    background:#E3EEE9; padding:3px 9px; border-radius:10px;
  }
  .change-log{
    display:flex; align-items:center; gap:10px; padding:9px 12px;
    background:var(--paper); border:1px solid var(--line); border-radius:12px; margin-bottom:6px;
  }
  .change-log .avatar{width:24px; height:24px; font-size:10px;}
  .change-log .avatar svg{width:13px; height:13px;}
  .change-log .log-text{flex:1; min-width:0; font-size:13px; line-height:1.35;}
  .change-log small{display:block; font-size:11.5px; color:var(--ink-soft);}
  .reason-row{display:flex; gap:6px; margin:0 0 12px;}
  .reason-row input{
    flex:1; min-width:0; padding:9px 11px; border-radius:11px; border:1px solid var(--line);
    font-size:14px; font-family:'Inter',sans-serif;
  }
  .reason-quick{
    border:1px solid var(--line); background:var(--chalk); border-radius:11px; padding:0 11px;
    font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; font-family:'Inter',sans-serif;
  }

  /* ---- Ergebnisse ---- */
  .bilanz-table{margin-top:16px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--paper);}
  .bilanz-row{display:flex; align-items:center; gap:11px; padding:12px 14px; border-bottom:1px solid var(--line);}
  .bilanz-row:last-child{border-bottom:none;}
  .bilanz-row .avatar{width:26px;height:26px;font-size:11px;}
  .bilanz-name{width:74px; font-weight:600; font-size:13.5px; flex-shrink:0;}
  .bilanz-bar-wrap{flex:1; display:flex; height:8px; border-radius:6px; overflow:hidden; background:var(--chalk);}
  .bilanz-bar-win{height:100%; background:var(--court);}
  .bilanz-bar-loss{height:100%; background:var(--clay-soft);}
  .bilanz-num{width:88px; text-align:right; font-size:12px; color:var(--ink-soft); flex-shrink:0;}
  .match-row{position:relative; margin-bottom:10px; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
  .match-teams{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .team-selects{flex:1; display:flex; flex-direction:column; gap:6px;}
  .team-select{
    width:100%; padding:7px 8px; border-radius:9px; border:1px solid var(--line);
    background:var(--chalk); font-size:13px; font-family:'Inter',sans-serif; color:var(--ink);
  }
  .vs-label{font-size:11.5px; color:var(--ink-soft); font-weight:700; flex-shrink:0; padding:0 2px;}
  .sets-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .sets-row span.set-label{width:52px; font-size:12px; color:var(--ink-soft); flex-shrink:0;}
  .sets-row input{
    width:44px; padding:6px 4px; text-align:center; border-radius:8px;
    border:1px solid var(--line); font-size:14px; font-family:'Inter',sans-serif;
  }
  .sets-row .colon{color:var(--ink-soft); font-weight:700;}
  .add-set-btn{
    background:none; border:none; color:var(--court); font-size:12.5px;
    text-decoration:underline; cursor:pointer; padding:2px 0; font-family:'Inter',sans-serif;
  }
  .status-badge{
    display:inline-block; margin-top:6px; font-size:12.5px; font-weight:600;
    padding:4px 10px; border-radius:10px; background:var(--chalk); color:var(--ink-soft);
  }
  .status-badge.decided{background:var(--court); color:var(--chalk);}
  .status-badge.tied{background:var(--clay-soft); color:var(--clay);}

  /* bottom sheet */
  .overlay{
    position:fixed; inset:0; background:rgba(30,42,34,0.38);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
    opacity:0; pointer-events:none; transition:opacity 0.22s ease;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    background:var(--paper);
    width:100%; max-width:520px;
    border-radius:22px 22px 0 0;
    padding:10px 18px 26px;
    box-shadow:0 -10px 32px rgba(0,0,0,0.2);
    transform:translateY(100%);
    transition:transform 0.28s cubic-bezier(.32,.72,0,1);
  }
  .overlay.open .sheet{transform:translateY(0);}
  .drag-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 14px;}
  .sheet h3{margin:0 0 4px; font-size:16px;}
  .sheet .sub{font-size:12.5px; color:var(--ink-soft); margin:0 0 14px;}
  .sheet-options{display:flex; flex-direction:column; gap:7px;}
  .sheet-options button{
    text-align:left; padding:10px 12px; border-radius:12px;
    border:1px solid var(--line); border-left:4px solid transparent;
    background:var(--chalk); display:flex; align-items:center; gap:10px;
    font-size:15px; font-weight:600; font-family:'Inter',sans-serif;
    cursor:pointer; color:var(--ink);
  }
  .sheet-options button.current{
    border-left-width:4px; font-weight:700;
  }
  .guest-input-row{display:none; gap:8px; margin-top:10px;}
  .guest-input-row.open{display:flex;}
  .guest-input-row input{
    flex:1; padding:11px 12px; border-radius:12px;
    border:1px solid var(--line); font-size:15px; font-family:'Inter',sans-serif;
  }
  .guest-input-row button{
    padding:0 16px; border-radius:12px; border:none;
    background:var(--ball); color:var(--ball-ink); font-weight:700;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .sheet-close{
    display:block; margin:14px auto 0; background:none; border:none;
    color:var(--ink-soft); font-size:13px; cursor:pointer; text-decoration:underline;
  }

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--chalk); padding:10px 18px; border-radius:20px;
    font-size:13px; opacity:0; transition:all 0.25s ease; z-index:60; pointer-events:none;
  }

<script>
(function(){
  "use strict";

  // ====== EINRICHTUNG ======
  // Hier die eigene, private Firebase-Datenbank-URL eintragen (siehe Anleitung).
  // Beispiel: "https://donnerstagrunde-default-rtdb.europe-west1.firebasedatabase.app"
  var FIREBASE_DB_URL = "https://tennis-abo-312a8-default-rtdb.europe-west1.firebasedatabase.app";
  // ==========================

  function isConfigured(){
    return FIREBASE_DB_URL.indexOf("DEIN-PROJEKT-ID") === -1;
  }

  var PLAYERS = ["Aufreiter","Priller","Grandl","Praska","Schimek"];
  var PLAYER_COLORS = {
    Aufreiter:"#2F6FA8",
    Priller:"#C4432B",
    Grandl:"#7A4E9E",
    Praska:"#C99A2E",
    Schimek:"#1E7A6E"
  };
  var PREIS_PRO_EINSATZ = 1485/104;

  var DEFAULT_SCHEDULE = [
    {date:"2026-10-08", holiday:false, players:["Aufreiter","Priller","Schimek","Praska"]},
    {date:"2026-10-15", holiday:false, players:["Priller","Aufreiter","Praska","Schimek"]},
    {date:"2026-10-22", holiday:false, players:["Priller","Praska","Schimek","Aufreiter"]},
    {date:"2026-10-29", holiday:false, players:["Praska","Schimek","Aufreiter","Priller"]},
    {date:"2026-11-05", holiday:false, players:["Schimek","Aufreiter","Priller","Grandl"]},
    {date:"2026-11-12", holiday:false, players:["Aufreiter","Priller","Grandl","Praska"]},
    {date:"2026-11-19", holiday:false, players:["Priller","Grandl","Praska","Schimek"]},
    {date:"2026-11-26", holiday:false, players:["Grandl","Praska","Schimek","Aufreiter"]},
    {date:"2026-12-03", holiday:false, players:["Praska","Schimek","Aufreiter","Priller"]},
    {date:"2026-12-10", holiday:false, players:["Schimek","Aufreiter","Priller","Grandl"]},
    {date:"2026-12-17", holiday:false, players:["Aufreiter","Priller","Grandl","Praska"]},
    {date:"2026-12-24", holiday:true,  players:["Priller","Grandl","Praska","Schimek"]},
    {date:"2026-12-31", holiday:true,  players:["Grandl","Praska","Schimek","Aufreiter"]},
    {date:"2027-01-07", holiday:false, players:["Praska","Schimek","Aufreiter","Priller"]},
    {date:"2027-01-14", holiday:false, players:["Schimek","Aufreiter","Priller","Grandl"]},
    {date:"2027-01-21", holiday:false, players:["Aufreiter","Priller","Grandl","Praska"]},
    {date:"2027-01-28", holiday:false, players:["Priller","Grandl","Praska","Schimek"]},
    {date:"2027-02-04", holiday:false, players:["Grandl","Praska","Schimek","Aufreiter"]},
    {date:"2027-02-11", holiday:false, players:["Praska","Schimek","Aufreiter","Priller"]},
    {date:"2027-02-18", holiday:false, players:["Schimek","Aufreiter","Priller","Grandl"]},
    {date:"2027-02-25", holiday:false, players:["Aufreiter","Priller","Grandl","Praska"]},
    {date:"2027-03-04", holiday:false, players:["Priller","Grandl","Praska","Schimek"]},
    {date:"2027-03-11", holiday:false, players:["Grandl","Praska","Schimek","Aufreiter"]},
    {date:"2027-03-18", holiday:false, players:["Praska","Schimek","Aufreiter","Priller"]},
    {date:"2027-03-25", holiday:false, players:["Schimek","Aufreiter","Priller","Grandl"]},
    {date:"2027-04-01", holiday:false, players:["Aufreiter","Grandl","Schimek","Praska"]}
  ];

  var schedule = null;
  var editTarget = null; // {dateIdx, slotIdx}

  var heroEl = document.getElementById("hero");
  var seasonEl = document.getElementById("seasonView");
  var resultsEl = document.getElementById("resultsView");
  var statsEl = document.getElementById("statsView");
  var overlay = document.getElementById("overlay");
  var sheetOptions = document.getElementById("sheetOptions");
  var sheetSub = document.getElementById("sheetSub");
  var guestRow = document.getElementById("guestRow");
  var guestInput = document.getElementById("guestInput");
  var reasonInput = document.getElementById("reasonInput");
  var toastEl = document.getElementById("toast");

  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function parseDate(iso){
    var p = iso.split("-");
    return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  }
  function todayMidnight(){
    var d = new Date();
    d.setHours(0,0,0,0);
    return d;
  }
  function fmtDDMM(d){ return pad(d.getDate())+"."+pad(d.getMonth()+1); }
  function fmtDDMMYYYY(d){ return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear(); }
  function weekdayShort(d){ return d.toLocaleDateString("de-AT",{weekday:"short"}); }
  function weekdayLong(d){ return d.toLocaleDateString("de-AT",{weekday:"long"}); }
  function monthLabel(d){ return d.toLocaleDateString("de-AT",{month:"long",year:"numeric"}); }
  function isGuest(name){ return name === "Gast" || (name && name.indexOf("Gast:") === 0); }
  function esc(s){
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function initials(name){ return name ? esc(name.charAt(0).toUpperCase()) : "?"; }
  function playerLabel(name){
    if(!isGuest(name)) return name;
    var custom = name.indexOf("Gast:")===0 ? name.slice(5).trim() : "";
    return custom ? custom+" (Gast)" : "Gast";
  }

  var expandedThirdSet = {};

  // ---- Colarum-Konto (Schläger fallen gelassen) ----
  var colarum = [];
  var colarumBusy = 0;
  var showAllColarum = false;

  // ---- Einspringer und Terminänderungen ----
  var showAllChanges = false;

  // Merkt sich pro Platz, wer ursprünglich eingeteilt war und warum getauscht wurde.
  function recordSubstitution(entry, slot, oldName, newName, reason){
    if(!entry.subs) entry.subs = {};
    var key = "s"+slot;
    var rec = entry.subs[key];
    var from = rec ? rec.from : oldName;
    if(newName === from){
      delete entry.subs[key];
      if(Object.keys(entry.subs).length === 0) delete entry.subs;
      return;
    }
    entry.subs[key] = {from:from, reason:reason || "", ts:Date.now()};
  }

  // Bereits erfolgte Tauschaktionen (vor Einführung des Protokolls) werden
  // anhand des ursprünglichen Aboplans erkannt.
  function backfillSubs(){
    if(!schedule) return;
    var byDate = {};
    DEFAULT_SCHEDULE.forEach(function(e){ byDate[e.date] = e; });
    schedule.forEach(function(entry){
      if(!entry || !entry.players) return;
      var base = byDate[entry.origDate || entry.date];
      if(!base) return;
      for(var i=0;i<entry.players.length;i++){
        var key = "s"+i;
        if(entry.subs && entry.subs[key]) continue;
        var orig = base.players[i];
        if(orig && entry.players[i] !== orig){
          if(!entry.subs) entry.subs = {};
          entry.subs[key] = {from:orig, reason:"", ts:0};
        }
      }
    });
  }

  function renderChangesSection(){
    var items = [];
    schedule.forEach(function(entry){
      if(entry.subs){
        Object.keys(entry.subs).forEach(function(k){
          var rec = entry.subs[k];
          var slot = parseInt(k.slice(1),10);
          var to = entry.players[slot];
          if(!rec || to === undefined || to === rec.from) return;
          items.push({type:"sub", date:entry.date, ts:rec.ts||0, from:rec.from, to:to, reason:rec.reason||""});
        });
      }
      if(entry.origDate && entry.origDate !== entry.date){
        items.push({type:"move", date:entry.date, ts:entry.movedTs||0, from:entry.origDate});
      }
    });
    items.sort(function(a,b){ return (b.ts - a.ts) || b.date.localeCompare(a.date); });

    var subs = items.filter(function(x){ return x.type === "sub"; });
    var moves = items.filter(function(x){ return x.type === "move"; });
    var absent = {};
    subs.forEach(function(x){ if(PLAYERS.indexOf(x.from) !== -1) absent[x.from] = (absent[x.from]||0)+1; });
    var absentList = PLAYERS.filter(function(p){ return absent[p]; })
      .sort(function(a,b){ return absent[b] - absent[a]; })
      .map(function(p){ return p+" ("+absent[p]+")"; });

    var html = '<div class="month-group"><p class="month-title">Einspringer und Terminänderungen</p><div class="net-divider"></div>'
      + '<p class="stats-note" style="margin:0 2px 12px;">Hier wird festgehalten, wer für wen eingesprungen ist und welche Termine verschoben wurden.</p>';

    if(items.length === 0){
      return html + '<p class="stats-note">Noch keine Änderungen. Alle spielen wie geplant.</p></div>';
    }

    var parts = [];
    if(subs.length) parts.push(subs.length + ' Einspringer');
    if(moves.length) parts.push(moves.length + (moves.length === 1 ? ' verschobener Termin' : ' verschobene Termine'));
    html += '<span class="status-badge tied" style="margin-top:0;">Gesamt: '+parts.join(", ")+'</span>';
    if(absentList.length){
      html += '<p class="stats-note" style="margin-top:8px;">Ausgefallen: '+absentList.join(", ")+'.</p>';
    }

    var shown = showAllChanges ? items : items.slice(0,6);
    html += '<div style="margin-top:12px;">';
    shown.forEach(function(x){
      var dd = x.date ? parseDate(x.date) : null;
      var dateText = dd ? weekdayShort(dd)+" "+fmtDDMMYYYY(dd) : "";
      if(x.type === "sub"){
        html += '<div class="change-log">'
          + '<span class="avatar" style="background:'+(PLAYER_COLORS[x.from]||"#8A8A8A")+'">'+initials(x.from)+'</span>'
          + '<span class="log-text"><b>'+esc(playerLabel(x.from))+'</b> ersetzt durch <b>'+esc(playerLabel(x.to))+'</b>'
          + '<small>'+esc(dateText)+(x.reason ? ' · '+esc(x.reason) : '')+'</small></span>'
          + '</div>';
      }else{
        var od = parseDate(x.from);
        html += '<div class="change-log">'
          + '<span class="avatar" style="background:var(--court)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>'
          + '<span class="log-text"><b>Termin verschoben</b> auf '+esc(dateText)
          + '<small>ursprünglich '+weekdayShort(od)+' '+fmtDDMMYYYY(od)+'</small></span>'
          + '</div>';
      }
    });
    html += '</div>';
    if(items.length > 6){
      html += '<button class="add-set-btn" id="changesToggle">'+(showAllChanges ? 'Weniger anzeigen' : 'Alle '+items.length+' anzeigen')+'</button>';
    }
    html += '</div>';
    return html;
  }

  function isoToday(){
    var d = new Date();
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }
  function newColarumId(){
    return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  }
  function colarumUrl(path){
    return FIREBASE_DB_URL + "/colarum" + path + ".json";
  }

  async function loadColarum(){
    if(colarumBusy > 0) return;
    try{
      var res = await fetch(colarumUrl(""));
      if(!res.ok) throw new Error("HTTP "+res.status);
      var data = await res.json();
      var list = [];
      if(data){
        Object.keys(data).forEach(function(k){
          var e = data[k];
          if(e && e.player){
            list.push({id:k, player:e.player, date:e.date||"", paid:!!e.paid, ts:e.ts||0});
          }
        });
      }
      list.sort(function(a,b){ return b.ts - a.ts; });
      colarum = list;
    }catch(e){
      // Verbindungsfehler meldet bereits loadSchedule; bisheriger Stand bleibt erhalten
    }
  }

  async function addColarum(player){
    var ev = {player:player, date:isoToday(), paid:false, ts:Date.now()};
    var id = newColarumId();
    colarum.unshift({id:id, player:ev.player, date:ev.date, paid:false, ts:ev.ts});
    renderStats();
    colarumBusy++;
    try{
      var res = await fetch(colarumUrl("/"+id), {
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(ev)
      });
      if(!res.ok) throw new Error("HTTP "+res.status);
      showToast(player+" schuldet eine Cola-Rum-Runde.");
    }catch(e){
      colarum = colarum.filter(function(x){ return x.id !== id; });
      renderStats();
      showToast("Speichern fehlgeschlagen – bitte erneut versuchen.");
    }finally{
      colarumBusy--;
    }
  }

  async function setColarumPaid(id, paid){
    var item = colarum.filter(function(x){ return x.id === id; })[0];
    if(!item) return;
    var old = item.paid;
    item.paid = paid;
    renderStats();
    colarumBusy++;
    try{
      var res = await fetch(colarumUrl("/"+id+"/paid"), {
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(paid)
      });
      if(!res.ok) throw new Error("HTTP "+res.status);
    }catch(e){
      item.paid = old;
      renderStats();
      showToast("Speichern fehlgeschlagen – bitte erneut versuchen.");
    }finally{
      colarumBusy--;
    }
  }

  async function deleteColarum(id){
    var idx = -1;
    for(var i=0;i<colarum.length;i++){ if(colarum[i].id === id){ idx = i; break; } }
    if(idx === -1) return;
    var removed = colarum.splice(idx,1)[0];
    renderStats();
    colarumBusy++;
    try{
      var res = await fetch(colarumUrl("/"+id), {
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body: "null"
      });
      if(!res.ok) throw new Error("HTTP "+res.status);
    }catch(e){
      colarum.push(removed);
      colarum.sort(function(a,b){ return b.ts - a.ts; });
      renderStats();
      showToast("Löschen fehlgeschlagen – bitte erneut versuchen.");
    }finally{
      colarumBusy--;
    }
  }

  function renderColarumSection(){
    var counts = {};
    PLAYERS.forEach(function(p){ counts[p] = {open:0, paid:0}; });
    colarum.forEach(function(e){
      if(!counts[e.player]) return;
      if(e.paid) counts[e.player].paid++; else counts[e.player].open++;
    });
    function totalOf(p){ return counts[p].open + counts[p].paid; }
    var order = PLAYERS.slice().sort(function(a,b){
      return (totalOf(b) - totalOf(a)) || (PLAYERS.indexOf(a) - PLAYERS.indexOf(b));
    });
    var max = Math.max.apply(null, order.map(totalOf).concat([1]));
    var totalAll = 0, totalOpen = 0;
    PLAYERS.forEach(function(p){ totalAll += totalOf(p); totalOpen += counts[p].open; });

    function rundenText(n){ return n + (n === 1 ? " Runde" : " Runden"); }

    var html = '<div class="month-group"><p class="month-title">Cola-Rum-Runde</p><div class="net-divider"></div>'
      + '<p class="stats-note" style="margin:0 2px 12px;">Wer den Schläger fallen lässt, zahlt eine ganze Cola-Rum-Runde – aus rein disziplinären Gründen, versteht sich. Berufung ist nicht vorgesehen, Ausreden werden nicht protokolliert. Zum Eintragen einfach auf das Plus tippen.</p>'
      + '<div class="stats-table">';
    order.forEach(function(p){
      var c = counts[p];
      var pct = Math.round((totalOf(p)/max)*100);
      html += '<div class="stats-row">'
        + '<span class="avatar" style="background:'+PLAYER_COLORS[p]+'">'+initials(p)+'</span>'
        + '<span class="stats-name">'+p+'</span>'
        + '<span class="colarum-info">'
        +   '<span class="stats-bar-wrap"><span class="stats-bar" style="width:'+pct+'%;background:'+PLAYER_COLORS[p]+';"></span></span>'
        +   '<span class="colarum-meta">'+c.open+' offen · '+c.paid+' bezahlt</span>'
        + '</span>'
        + '<button class="colarum-add" data-colarum-add="'+p+'" aria-label="Schlägerwurf für '+p+' eintragen">+</button>'
        + '</div>';
    });
    html += '</div>';

    if(totalAll === 0){
      html += '<p class="stats-note">Noch kein Schläger geflogen. Die Disziplin hält – vorerst.</p>';
    }else{
      var leaders = order.filter(function(p){ return totalOf(p) === max; });
      html += '<span class="status-badge tied" style="margin-top:12px;">Schläger-König: '+leaders.join(", ")
        + ' ('+(leaders.length>1 ? 'je ' : '')+max+(max===1 ? ' Wurf' : ' Würfe')+')</span>';
      html += '<p class="stats-note" style="margin-top:8px;">Gesamt: '+rundenText(totalAll)
        + (totalOpen > 0 ? ', davon '+totalOpen+' offen. Die Bar freut sich.' : ', alle beglichen. Vorbildlich.')+'</p>';

      var shown = showAllColarum ? colarum : colarum.slice(0,8);
      html += '<p class="colarum-sub">Disziplinarprotokoll</p>';
      shown.forEach(function(e){
        var dateText = e.date ? fmtDDMMYYYY(parseDate(e.date)) : "";
        html += '<div class="colarum-log">'
          + '<span class="avatar" style="background:'+(PLAYER_COLORS[e.player]||"#8A8A8A")+'">'+initials(e.player)+'</span>'
          + '<span class="log-text"><b>'+esc(e.player)+'</b> · '+esc(dateText)+'</span>'
          + '<button class="log-paid'+(e.paid?' is-paid':'')+'" data-colarum-paid="'+esc(e.id)+'">'+(e.paid?'bezahlt':'offen')+'</button>'
          + '<button class="log-del" data-colarum-del="'+esc(e.id)+'" aria-label="Eintrag löschen">×</button>'
          + '</div>';
      });
      if(colarum.length > 8){
        html += '<button class="add-set-btn" id="colarumToggle">'+(showAllColarum ? 'Weniger anzeigen' : 'Alle '+colarum.length+' anzeigen')+'</button>';
      }
    }
    html += '</div>';
    return html;
  }

  function normalizeResult(entry){
    if(!entry.result){
      entry.result = {
        teamA:[entry.players[0], entry.players[1]],
        sets:[{a:null,b:null},{a:null,b:null},{a:null,b:null}]
      };
    }else{
      var valid = entry.result.teamA.filter(function(n){ return entry.players.indexOf(n) !== -1; });
      for(var i=0;i<entry.players.length && valid.length<2;i++){
        if(valid.indexOf(entry.players[i]) === -1) valid.push(entry.players[i]);
      }
      entry.result.teamA = valid.slice(0,2);
      if(!entry.result.sets) entry.result.sets = [{a:null,b:null},{a:null,b:null},{a:null,b:null}];
      while(entry.result.sets.length<3) entry.result.sets.push({a:null,b:null});
    }
    return entry.result;
  }

  function getTeamB(entry){
    var res = normalizeResult(entry);
    return entry.players.filter(function(p){ return res.teamA.indexOf(p) === -1; });
  }

  function computeMatchStatus(entry){
    var res = normalizeResult(entry);
    var setsA=0, setsB=0, anyEntered=false;
    res.sets.forEach(function(s){
      if(s.a!=null && s.b!=null){
        anyEntered = true;
        if(s.a>s.b) setsA++; else if(s.b>s.a) setsB++;
      }
    });
    var status = "offen";
    if(anyEntered){
      if(setsA>setsB) status="A";
      else if(setsB>setsA) status="B";
      else status="unentschieden";
    }
    return {status:status, setsA:setsA, setsB:setsB};
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }

  async function loadSchedule(){
    try{
      var res = await fetch(FIREBASE_DB_URL + "/schedule.json");
      if(!res.ok) throw new Error("HTTP "+res.status);
      var data = await res.json();
      if(data){
        schedule = data;
      }else{
        schedule = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
        await saveSchedule(true);
      }
      backfillSubs();
    }catch(e){
      if(!schedule) schedule = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
      showToast("Keine Verbindung zur Datenbank – bitte Internet prüfen.");
    }
  }

  async function saveSchedule(silent){
    try{
      var res = await fetch(FIREBASE_DB_URL + "/schedule.json", {
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(schedule)
      });
      if(!res.ok && !silent){ showToast("Speichern fehlgeschlagen – bitte erneut versuchen."); }
    }catch(e){
      if(!silent){ showToast("Speichern fehlgeschlagen – bitte Internet prüfen."); }
    }
  }

  function findNextIndex(){
    var today = todayMidnight();
    for(var i=0;i<schedule.length;i++){
      if(parseDate(schedule[i].date) >= today) return i;
    }
    return -1;
  }

  function renderChip(name, dateIdx, slotIdx){

    var subHtml = (rec && rec.from !== name)
      ? '<small class="chip-sub">für '+esc(playerLabel(rec.from))+(rec.reason ? ' · '+esc(rec.reason) : '')+'</small>'
      : '';
    return '<button class="chip'+(guest?' guest':'')+'" data-date-idx="'+dateIdx+'" data-slot-idx="'+slotIdx+'">'
      + avatarHtml
      + '<span class="chip-text"><span>'+esc(label)+(guest && customName ? ' · Gast' : '')+'</span>'+subHtml+'</span>'
      + '</button>';

  function renderResults(){
    // Saisonbilanz
    var tally = {};
    PLAYERS.forEach(function(p){ tally[p] = {w:0,l:0}; });
    schedule.forEach(function(entry){
      var st = computeMatchStatus(entry);
      if(st.status!=="A" && st.status!=="B") return;
      var res = normalizeResult(entry);
      var winners = st.status==="A" ? res.teamA : getTeamB(entry);
      var losers = st.status==="A" ? getTeamB(entry) : res.teamA;
      winners.forEach(function(n){ if(tally[n]) tally[n].w++; });
      losers.forEach(function(n){ if(tally[n]) tally[n].l++; });
    });
    var maxTotal = Math.max.apply(null, PLAYERS.map(function(p){return tally[p].w+tally[p].l;}).concat([1]));
    var html = '<div class="bilanz-table">';
    PLAYERS.forEach(function(p){
      var t = tally[p];
      var total = t.w+t.l;
      var winPct = total>0 ? Math.round((t.w/total)*100) : 0;
      var barScale = total>0 ? (total/maxTotal)*100 : 0;
      html += '<div class="bilanz-row">'
        + '<span class="avatar" style="background:'+PLAYER_COLORS[p]+'">'+initials(p)+'</span>'
        + '<span class="bilanz-name">'+p+'</span>'
        + '<span class="bilanz-bar-wrap"><span class="bilanz-bar-win" style="width:'+(barScale*(winPct/100))+'%"></span><span class="bilanz-bar-loss" style="width:'+(barScale*(1-winPct/100))+'%"></span></span>'
        + '<span class="bilanz-num">'+t.w+' S · '+t.l+' N</span>'
        + '</div>';
    });
    html += '</div>';
    html += '<p class="stats-note">Sieg oder Niederlage zählt für alle Spieler eines Teams, sobald ein Spiel entschieden ist. Ein Gastspieler taucht in dieser Bilanz nicht auf, sein Teampartner schon.</p>';

    // Einzelne Spiele
    var today = todayMidnight();
    var lastMonth = "";
    html += '<div id="matchList">';
    for(var i=0;i<schedule.length;i++){
      var entry = schedule[i];
      var d = parseDate(entry.date);
      var mLabel = monthLabel(d);
      if(mLabel !== lastMonth){
        if(lastMonth !== "") html += "</div></div>";
        html += '<div class="month-group"><p class="month-title">'+mLabel+'</p><div class="net-divider"></div><div class="timeline">';
        lastMonth = mLabel;
      }
      var res = normalizeResult(entry);
      var teamB = getTeamB(entry);
      var st = computeMatchStatus(entry);
      var showThird = expandedThirdSet[i] || (res.sets[2].a!=null || res.sets[2].b!=null);
      var past = d < today;

      html += '<div class="row match-row'+(past?' past':'')+'" data-date-idx="'+i+'">'
        + '<div class="row-date-wrap">'
        + '<span class="row-date"><span class="wk">'+weekdayShort(d)+'</span> '+fmtDDMM(d)+'.'+d.getFullYear()+'</span>'
        + (entry.holiday ? '<span class="holiday-tag">Feiertag</span>' : '')
        + '</div>';

      html += '<div class="match-teams">'
        + '<div class="team-selects">'
        + buildTeamSelect(i, 0, entry.players, res.teamA[0])
        + buildTeamSelect(i, 1, entry.players, res.teamA[1])
        + '</div>'
        + '<span class="vs-label">gegen</span>'
        + '<div class="team-selects">'
        + '<span class="team-select" style="background:transparent;border-color:transparent;padding-top:7px;">'+esc(playerLabel(teamB[0]))+'</span>'
        + '<span class="team-select" style="background:transparent;border-color:transparent;padding-top:7px;">'+esc(playerLabel(teamB[1]))+'</span>'
        + '</div>'
        + '</div>';

      for(var s=0;s<(showThird?3:2);s++){
        html += '<div class="sets-row">'
          + '<span class="set-label">Satz '+(s+1)+'</span>'
          + '<input type="number" inputmode="numeric" min="0" max="30" data-date-idx="'+i+'" data-set-idx="'+s+'" data-side="a" value="'+(res.sets[s].a!=null?res.sets[s].a:'')+'">'
          + '<span class="colon">:</span>'
          + '<input type="number" inputmode="numeric" min="0" max="30" data-date-idx="'+i+'" data-set-idx="'+s+'" data-side="b" value="'+(res.sets[s].b!=null?res.sets[s].b:'')+'">'
          + '</div>';
      }
      if(!showThird){
        html += '<button class="add-set-btn" data-expand-idx="'+i+'">+ 3. Satz</button>';
      }

      var badgeClass = st.status==="A"||st.status==="B" ? "decided" : (st.status==="unentschieden" ? "tied" : "");
      var badgeText;
      if(st.status==="A") badgeText = esc(playerLabel(res.teamA[0]))+' & '+esc(playerLabel(res.teamA[1]))+' gewinnen ('+st.setsA+':'+st.setsB+')';
      else if(st.status==="B") badgeText = esc(playerLabel(teamB[0]))+' & '+esc(playerLabel(teamB[1]))+' gewinnen ('+st.setsB+':'+st.setsA+')';
      else if(st.status==="unentschieden") badgeText = 'Unentschieden nach '+ (st.setsA+st.setsB) +' Sätzen';
      else badgeText = 'Ergebnis noch offen';
      html += '<span class="status-badge '+badgeClass+'">'+badgeText+'</span>';

      html += '</div>';
    }
    html += "</div></div>";
    resultsEl.innerHTML = html;
  }

  function buildTeamSelect(dateIdx, slotIdx, players, selected){
    var opts = players.map(function(p){
      return '<option value="'+esc(p)+'"'+(p===selected?' selected':'')+'>'+esc(playerLabel(p))+'</option>';
    }).join("");
    return '<select class="team-select" data-date-idx="'+dateIdx+'" data-slot-idx="'+slotIdx+'">'+opts+'</select>';
  }

  function renderStats(){
    var counts = {};
    PLAYERS.forEach(function(p){ counts[p]=0; });
    counts["Gast"]=0;
    schedule.forEach(function(entry){
      entry.players.forEach(function(name){
        if(isGuest(name)) counts["Gast"]++;
        else if(counts.hasOwnProperty(name)) counts[name]++;
        else counts[name] = (counts[name]||0)+1;
      });
    });
    var max = Math.max.apply(null, PLAYERS.map(function(p){return counts[p];}).concat([1]));
    var html = '<div class="month-group"><p class="month-title">Einsätze und Kosten</p><div class="net-divider"></div>'
      + '<div class="stats-table" style="margin-top:0;">';
    PLAYERS.forEach(function(p){
      var c = counts[p]||0;
      var pct = Math.round((c/max)*100);
      var kosten = Math.round(c*PREIS_PRO_EINSATZ);
      var color = PLAYER_COLORS[p];
      html += '<div class="stats-row">'
        + '<span class="avatar" style="background:'+color+'">'+initials(p)+'</span>'
        + '<span class="stats-name">'+p+'</span>'
        + '<span class="stats-bar-wrap"><span class="stats-bar" style="width:'+pct+'%;background:'+color+';"></span></span>'
        + '<span class="stats-num">'+c+' Einsätze · €'+kosten+'</span>'
        + '</div>';
    });
    if(counts["Gast"]>0){
      html += '<div class="stats-row">'
        + '<span class="avatar" style="background:transparent;border:1.5px dashed var(--clay);color:var(--clay);">?</span>'
        + '<span class="stats-name">Gast</span>'
        + '<span class="stats-bar-wrap"><span class="stats-bar" style="width:'+Math.round((counts["Gast"]/max)*100)+'%;background:var(--clay);"></span></span>'
        + '<span class="stats-num">'+counts["Gast"]+' Einsätze</span>'
        + '</div>';
    }
    html += '</div>';
    html += '<p class="stats-note">Kostenanteil auf Basis des Aboplans: 26 Wochen, 104 Einsätze gesamt, €1.485,00 Gesamtpreis (≈ €'+PREIS_PRO_EINSATZ.toFixed(2).replace(".",",")+' pro Einsatz). Einsätze eines Gastspielers werden hier nicht auf die fünf Abonnenten verrechnet.</p>';
    html += '</div>';
    statsEl.innerHTML = renderColarumSection() + html + renderChangesSection();
  }

  function renderAll(){
    renderHero();
    renderSeason();
    renderResults();
    renderStats();

  async function applyChoice(name){
    if(!editTarget) return;
    var entry = schedule[editTarget.dateIdx];
    var slot = editTarget.slotIdx;
    var key = "s"+slot;
    var oldName = entry.players[slot];
    var reason = reasonInput.value.trim().slice(0,40);
    var rec = entry.subs ? entry.subs[key] : null;

    if(name === oldName){
      // gleicher Spieler: nur den Grund aktualisieren, falls geändert
      if(rec && rec.reason !== reason){
        rec.reason = reason;
        await saveSchedule(false);
        renderAll();
        showToast("Grund gespeichert.");
      }
      closeSheet();
      return;
    }

    recordSubstitution(entry, slot, oldName, name, reason);
    entry.players[slot] = name;
    var nowRec = entry.subs ? entry.subs[key] : null;
    await saveSchedule(false);
    renderAll();
    closeSheet();
    showToast(nowRec ? "Gespeichert und im Protokoll vermerkt." : "Gespeichert.");
  }

  document.addEventListener("change", async function(e){
    if(e.target.classList && e.target.classList.contains("date-edit-input")){
      var idx = parseInt(e.target.getAttribute("data-date-idx"),10);
      var newDate = e.target.value;
      if(newDate && schedule[idx] && newDate !== schedule[idx].date){
        var movedEntry = schedule[idx];
        var oldDate = movedEntry.date;
        movedEntry.date = newDate;
        if(!movedEntry.origDate) movedEntry.origDate = oldDate;
        if(movedEntry.origDate === newDate){ delete movedEntry.origDate; delete movedEntry.movedTs; }
        else movedEntry.movedTs = Date.now();
        schedule.sort(function(a,b){ return parseDate(a.date) - parseDate(b.date); });
        await saveSchedule(false);
        renderAll();
        showToast("Termin verschoben auf "+fmtDDMMYYYY(parseDate(newDate))+".");
      }
    }
  });
